services:
  web:
    build: .
    image: edge-collector-gc:latest
    container_name: edge-collector-gc
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/gc.db
    ports:
      # 宿主机访问端口可通过环境变量 HOST_PORT 配置（默认 8080）
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    volumes:
      - gc-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  verify:
    build: .
    image: edge-collector-gc:latest
    container_name: edge-collector-gc-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:8080
    # 验收服务：构建检查 + 代码测试 + API/HTTP 冒烟；退出码即验收结论
    command: ["sh", "/app/scripts/verify.sh"]
    profiles: ["verify"]

volumes:
  gc-data:
